name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install app, test dependencies and Chromium
        run: |
          python -m pip install -e ".[ai,dev]"
          python -m playwright install --with-deps chromium

      - name: Run tests (with a virtual display for the visible-browser test)
        env:
          TIKTOK_REQUIRE_BROWSER_TESTS: "1"
        run: xvfb-run -a pytest -q -rs
