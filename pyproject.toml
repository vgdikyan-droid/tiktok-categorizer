[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-categorizer"
version = "0.1.0"
description = "Sort the videos saved in your TikTok account into a categorized spreadsheet."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "openpyxl>=3.1,<4",
  "playwright>=1.45",
]

[project.optional-dependencies]
ai = ["anthropic>=1.13,<2"]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
tiktok-categorize = "tiktok_categorizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
